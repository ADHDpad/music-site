<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>応援歌メドレー</title>

    <style>
        body {
            background-color: #f5f5f5;
            color: #222;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            font-size: 40px;
        }

        .player {
            background-color: white;
            width: 350px;
            max-width: 90%;
            margin: 40px auto;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        button {
            display: block;
            width: 100%;
            margin: 15px 0;
            background-color: #222;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        #status {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>


<body>

    <div class="player">

        <h1>🎵 応援歌メドレー</h1>

        <!-- 選曲ボタン -->

        <button onclick="selectSong('music1')">
            石上を選択
        </button>

        <button onclick="selectSong('music2')">
            ローズを選択
        </button>

        <button onclick="selectSong('music3')">
            清宮を選択
        </button>


        <!-- 再生ボタン -->

        <button onclick="startPlaylist()">
            ▶ 選んだ曲をメドレー再生
        </button>


        <!-- リセット -->

        <button onclick="clearPlaylist()">
            選曲をリセット
        </button>


        <!-- 状態表示 -->

        <div id="status">
            曲を選んでください
        </div>

    </div>


<script>

    // ==========================================
    // Web Audio API
    // ==========================================

    const audioContext =
        new (window.AudioContext ||
             window.webkitAudioContext)();


    // ==========================================
    // 音楽ファイル
    // ==========================================

    const songs = {

        music1: "music1.m4a",
        music2: "music2.m4a",
        music3: "music3.m4a"

    };


    // ==========================================
    // 表示する名前
    // ==========================================

    const songNames = {

        music1: "石上",
        music2: "ローズ",
        music3: "清宮"

    };


    // ==========================================
    // 選んだ曲
    // ==========================================

    let playlist = [];


    // ==========================================
    // BPM170・4/4
    // ==========================================


    // 最初の1小節
    //
    // 60 ÷ 170 × 4
    //
    // = 約1.411765秒

const START_POSITION = 1.411765;

const PLAY_DURATION = 11.294118;

const NEXT_INTERVAL = 10.100118;


    // ==========================================
    // 次の曲を開始する間隔
    // ==========================================
    //
    // 11.294118秒より
    // 0.020秒（20ms）早く次曲を開始
    //
    // 前の曲は切らないので
    // 最後の20msだけ軽く重なります

    // ==========================================
    // 曲を選択
    // ==========================================

    function selectSong(songName) {

        playlist.push(songName);

        updateStatus();

    }


    // ==========================================
    // 選択中の曲を表示
    // ==========================================

    function updateStatus() {

        const status =
            document.getElementById("status");


        if (playlist.length === 0) {

            status.textContent =
                "曲を選んでください";

            return;

        }


        const names =
            playlist.map(song =>
                songNames[song]
            );


        status.textContent =
            "選択中：" +
            names.join(" → ");

    }


    // ==========================================
    // 選曲リセット
    // ==========================================

    function clearPlaylist() {

        playlist = [];

        updateStatus();

    }


    // ==========================================
    // 音楽ファイル読み込み
    // ==========================================

    async function loadSong(songName) {

        const response =
            await fetch(songs[songName]);


        if (!response.ok) {

            throw new Error(
                songs[songName] +
                " を読み込めません"
            );

        }


        const arrayBuffer =
            await response.arrayBuffer();


        const audioBuffer =
            await audioContext.decodeAudioData(
                arrayBuffer
            );


        return audioBuffer;

    }


    // ==========================================
    // メドレー再生
    // ==========================================

    async function startPlaylist() {

        if (playlist.length === 0) {

            alert(
                "先に曲を選んでください"
            );

            return;

        }


        const status =
            document.getElementById("status");


        status.textContent =
            "音楽を読み込んでいます…";


        try {

            // ------------------------------
            // AudioContext開始
            // ------------------------------

            await audioContext.resume();


            // ------------------------------
            // 選択した曲を全部先に読み込む
            // ------------------------------

            const buffers = [];


            for (const songName of playlist) {

                const buffer =
                    await loadSong(songName);

                buffers.push(buffer);

            }


            // ------------------------------
            // 再生開始時刻
            // ------------------------------
            //
            // 0.2秒後から開始
            // その間に全曲を予約する

            const startTime =
                audioContext.currentTime + 0.2;


            // ------------------------------
            // 全曲を事前予約
            // ------------------------------

            for (
                let i = 0;
                i < buffers.length;
                i++
            ) {

                const source =
                    audioContext
                        .createBufferSource();


                source.buffer =
                    buffers[i];


                source.connect(
                    audioContext.destination
                );


                // --------------------------
                // この曲を開始する時刻
                // --------------------------
                //
                // 1曲目
                // 0秒
                //
                // 2曲目
                // 11.274118秒
                //
                // 3曲目
                // 22.548236秒

                const songStartTime =
                    startTime +
                    (NEXT_INTERVAL * i);


                // --------------------------
                // 再生
                // --------------------------
                //
                // 音源の
                // 1.411765秒地点から
                //
                // 11.294118秒間
                // 再生する

                source.start(
                    songStartTime,
                    START_POSITION,
                    PLAY_DURATION
                );

            }


            status.textContent =
                "▶ メドレー再生中";


        }
        catch (error) {

            console.error(error);


            status.textContent =
                "音楽を読み込めませんでした";


            alert(
                "音楽ファイルの読み込みでエラーが発生しました"
            );

        }

    }

</script>


</body>

</html>
