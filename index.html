<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music</title>

    <style>
body {
    background-color: #f5f5f5;   /* サイト全体の背景 */
    color: #222;                 /* 文字色 */
    font-family: "Arial", sans-serif;
    text-align: center;
    margin: 0;
    padding: 40px 20px;
}

h1 {
    font-size: 50px;             /* タイトルの大きさ */
    letter-spacing: 5px;         /* 文字の間隔 */
}

.player {
    background-color: white;
    width: 350px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 25px;

    /* 影を付ける */
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
}

.song-title {
    font-size: 26px;
    font-weight: bold;
}

button {
    background-color: #222;
    color: white;
    border: none;

    padding: 15px 35px;
    font-size: 18px;

    border-radius: 30px;
    cursor: pointer;
}
    </style>

</head>

<body>


    <h1>🎵 MY MUSIC</h1>

    <button onclick="playMusic()">▶ 石上を再生</button>
    <button onclick="playMusic2()">▶ ローズを再生</button>
    <button onclick="playMusic3()">▶ 清宮を再生</button>
    <button onclick="startPlaylist()">▶ 選んだ曲を連続再生</button>

<script>
    const audioContext = new AudioContext();

    const songs = {
        music1: "music1.m4a",
        music2: "music2.m4a",
        music3: "music3.m4a"
    };

    let playlist = [];

    function playMusic() {
        playlist.push("music1");
    }

    function playMusic2() {
        playlist.push("music2");
    }

    function playMusic3() {
        playlist.push("music3");
    }

    async function loadSong(name) {
        const response = await fetch(songs[name]);
        const arrayBuffer = await response.arrayBuffer();
        return await audioContext.decodeAudioData(arrayBuffer);
    }

    async function startPlaylist() {
        await audioContext.resume();

        const buffers = [];

        for (const name of playlist) {
            const buffer = await loadSong(name);
            buffers.push(buffer);
        }

        const startTime = audioContext.currentTime + 0.1;

        for (let i = 0; i < buffers.length; i++) {
            const source = audioContext.createBufferSource();

            source.buffer = buffers[i];
            source.connect(audioContext.destination);

            source.start(startTime + (15.36 * i));

            // 8小節だけ再生
            source.stop(startTime + (15.36 * (i + 1)));
        }
    }
</script>

</body>

</html>
